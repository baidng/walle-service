listen 1935;
max_connections 800;
daemon off;
srs_log_tank console;
srs_log_level trace;

http_api {
  enabled on;
  listen 1985;
  crossdomain on;
}

http_server {
  enabled on;
  listen 8080;
  dir ./objs/nginx/html;
  crossdomain on;
}

exporter {
  enabled on;
  listen 9972;
  label baremetal;
  tag baremetal;
}

rtc_server {
  enabled on;
  listen 8000;
  # 自动探测本机网卡 IP 作为 WebRTC candidate；云服务器上会取公网 IP。
  # 若使用 NAT/VPC 且探测不到公网 IP，可改回固定值：candidate 1.2.3.4;
  candidate *;
  use_auto_detect_network_ip on;
  tcp {
    enabled on;
    listen 8000;
  }
}

vhost __defaultVhost__ {
  # 推流鉴权：SRS 每次收到新推流时回调本机 API，校验 URL 中的 ?secret=
  # 回调由 walle-api 处理（127.0.0.1:9000/api/srs/hook），返回 0 放行
  http_hooks {
    enabled on;
    on_publish http://127.0.0.1:9000/api/srs/hook;
  }
  http_remux {
    enabled on;
    mount [vhost]/[app]/[stream].flv;
  }
  hls {
    enabled on;
    hls_fragment 2;
    hls_window 10;
  }
  rtc {
    enabled on;
    rtmp_to_rtc on;
  }
}
