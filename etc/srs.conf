listen 1935;
max_connections 800;
daemon off;
srs_log_tank console;
srs_log_level trace;

http_api {
  enabled on;
  listen 1985;
  crossdomain on;
}

http_server {
  enabled on;
  listen 8080;
  dir ./objs/nginx/html;
  crossdomain on;
}

exporter {
  enabled on;
  listen 9972;
  label baremetal;
  tag baremetal;
}

rtc_server {
  enabled on;
  listen 8000;
  candidate 192.168.31.114;
  tcp {
    enabled on;
    listen 8000;
  }
}

vhost __defaultVhost__ {
  http_remux {
    enabled on;
    mount [vhost]/[app]/[stream].flv;
  }
  hls {
    enabled on;
    hls_fragment 2;
    hls_window 10;
  }
  rtc {
    enabled on;
    rtmp_to_rtc on;
  }
}
